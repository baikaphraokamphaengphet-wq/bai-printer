<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS ร้านใบกะเพรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* POS ใบกะเพรา — โทเคนทั้งหมด สร้างจาก tokens.json */
:root {
  --brand: #2f6b3f;
  --brand-dark: #24562f;
  --brand-tint: #dcebdf;
  --brand-wash: #eef5ef;
  --on-brand: #ffffff;
  --on-brand-soft: #ffffff2e;
  --accent: #f6c21a;
  --accent-strong: #a67a00;
  --accent-tint: #fff2bd;
  --accent-ink: #5c4300;
  --on-accent: #231a00;
  --noodle: #3e5c76;
  --noodle-tint: #e3ebf2;
  --bg: #eff0ec;
  --surface: #ffffff;
  --line: #d6d9d2;
  --line-strong: #858b85;
  --ink: #1c261f;
  --ink-muted: #565e58;
  --danger: #b3372b;
  --danger-tint: #fbe6e3;
  --scrim: rgba(28, 38, 31, 0.55);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --tap-min: 48px;
  --tap-main: 56px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px 0 #1c261f1f, 0 2px 6px 0 #1c261f14;
  --shadow-sheet: 0 -6px 24px 0 #1c261f33;
  --font-sans: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
}

/* ลำดับตัวอักษร */
.total { font-family: var(--font-sans); font-size: 32px; line-height: 36px; font-weight: 800; }
.table-no { font-family: var(--font-sans); font-size: 28px; line-height: 30px; font-weight: 800; }
.title { font-family: var(--font-sans); font-size: 22px; line-height: 28px; font-weight: 800; }
.body { font-family: var(--font-sans); font-size: 18px; line-height: 26px; font-weight: 400; }
.body-strong { font-family: var(--font-sans); font-size: 18px; line-height: 26px; font-weight: 700; }
.menu-name { font-family: var(--font-sans); font-size: 17px; line-height: 22px; font-weight: 600; }
.price { font-family: var(--font-sans); font-size: 20px; line-height: 24px; font-weight: 800; }
.label { font-family: var(--font-sans); font-size: 15px; line-height: 20px; font-weight: 600; }
.caption { font-family: var(--font-sans); font-size: 14px; line-height: 18px; font-weight: 600; }

/* POS ใบกะเพรา — สไตล์ส่วนประกอบ ใช้คู่กับ tokens.css · คลาสขึ้นต้นด้วย bk- · CSS ล้วน ไม่มีรูป ไม่มีแอนิเมชันซับซ้อน */

.bk, .bk *, .bk *::before, .bk *::after { box-sizing: border-box; }
.bk {
  font-family: var(--font-sans);
  font-size: 18px;
  line-height: 26px;
  color: var(--ink);
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
:where(.bk) button { font: inherit; color: inherit; cursor: pointer; }
:where(.bk) svg { display: block; flex: none; }
:where(.bk) :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.bk-ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.bk-ico--sm { width: 18px; height: 18px; }
.bk-ico--lg { width: 28px; height: 28px; }

/* ---------- โครงหน้าจอ ---------- */
.bk-screen { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--bg); }
.bk-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-3) var(--space-4) var(--space-5); }

/* ---------- แถบบน ---------- */
.bk-appbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: 64px; padding: 0 var(--space-3) 0 var(--space-4); background: var(--brand); color: var(--on-brand); }
.bk-brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; }
.bk-brand__logo { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); object-fit: cover; }
.bk-brand__mark { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--brand-dark); display: grid; place-items: center; }
.bk-brand__mark .bk-ico { width: 22px; height: 22px; }
.bk-staff { display: flex; align-items: center; gap: 8px; height: var(--tap-min); padding: 0 16px 0 6px; border: 0; border-radius: var(--radius-pill); background: var(--on-brand-soft); color: var(--on-brand); font-size: 17px; font-weight: 700; }
.bk-staff__avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; }
.bk-topnav { display: flex; gap: var(--space-2); margin-right: auto; margin-left: var(--space-5); }
.bk-topnav__item { height: var(--tap-min); padding: 0 22px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--on-brand); font-size: 18px; font-weight: 700; }
.bk-topnav__item.is-active { background: var(--accent); color: var(--on-accent); }

.bk-tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); height: 68px; background: var(--surface); border-top: 2px solid var(--line); }
.bk-tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; font-size: 15px; font-weight: 700; color: var(--ink-muted); }
.bk-tab.is-active { color: var(--brand); }
.bk-tab.is-active::before { content: ""; position: absolute; top: -2px; left: 26%; right: 26%; height: 4px; border-radius: 0 0 4px 4px; background: var(--accent); }

.bk-offline { flex: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px var(--space-4); background: var(--danger); color: var(--on-brand); font-size: 16px; font-weight: 700; line-height: 22px; }

/* ---------- ปุ่ม ---------- */
.bk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap-min); padding: 0 20px; border: 2px solid transparent; border-radius: var(--radius-md); font-size: 18px; font-weight: 800; line-height: 1.2; white-space: nowrap; background: var(--surface); color: var(--ink); }
.bk-btn--main { min-height: var(--tap-main); background: var(--brand); color: var(--on-brand); }
.bk-btn--main:active { background: var(--brand-dark); }
.bk-btn--accent { background: var(--accent); color: var(--on-accent); }
.bk-btn--ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.bk-btn--noodle { background: var(--noodle); color: var(--on-brand); }
.bk-btn--danger { background: var(--danger-tint); border-color: var(--danger); color: var(--danger); }
.bk-btn--block { width: 100%; }
.bk-btn[disabled], .bk-btn.is-disabled { background: var(--line); border-color: transparent; color: var(--ink-muted); }
.bk-iconbtn { flex: none; width: var(--tap-min); height: var(--tap-min); display: grid; place-items: center; border: 0; border-radius: var(--radius-md); background: var(--on-brand-soft); color: var(--on-brand); }

/* ---------- ชิป ป้าย ---------- */
.bk-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap; }
.bk-chip--rice { background: var(--brand-tint); color: var(--brand-dark); }
.bk-chip--noodle { background: var(--noodle-tint); color: var(--noodle); }
.bk-tag { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 13px; font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap; }
.bk-tag--rice { background: var(--brand-tint); color: var(--brand-dark); }
.bk-tag--noodle { background: var(--noodle-tint); color: var(--noodle); }
.bk-tag--unsent { background: var(--accent-tint); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--accent-strong); }
.bk-tag--sent { background: var(--brand-wash); color: var(--brand-dark); }
.bk-shop { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--on-brand); }
.bk-shop--rice { background: var(--brand); }
.bk-shop--noodle { background: var(--noodle); }
.bk-shop--take { background: var(--accent); color: var(--on-accent); }
.bk-shop .bk-ico { width: 20px; height: 20px; }

/* ---------- หน้าโต๊ะ ---------- */
.bk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: var(--space-3); }
.bk-stat { padding: 10px 14px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bk-stat__label { font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
.bk-stat__value { font-size: 26px; line-height: 32px; font-weight: 800; }

.bk-seg { display: flex; gap: var(--space-2); overflow-x: auto; margin: 0 calc(var(--space-4) * -1); padding: 2px var(--space-4) 4px; scrollbar-width: none; }
.bk-seg__item { flex: none; display: flex; align-items: center; gap: 8px; height: var(--tap-min); padding: 0 8px 0 16px; border: 2px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); font-size: 17px; font-weight: 700; white-space: nowrap; }
.bk-seg__count { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: var(--bg); font-size: 15px; font-weight: 800; display: grid; place-items: center; }
.bk-seg__item.is-active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.bk-seg__item.is-active .bk-seg__count { background: var(--on-brand-soft); }

.bk-zone { margin-top: var(--space-4); }
.bk-zone__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 20px; line-height: 26px; font-weight: 800; }
.bk-zone__meta { margin-left: auto; font-size: 15px; font-weight: 600; color: var(--ink-muted); }
.bk-tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }

.bk-table { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 104px; padding: 8px 8px 8px 10px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); text-align: left; }
.bk-table__no { font-size: 28px; line-height: 30px; font-weight: 800; }
.bk-table__state { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink-muted); }
.bk-table__amount { font-size: 20px; line-height: 24px; font-weight: 800; color: var(--accent-ink); }
.bk-time { display: inline-flex; align-items: center; align-self: flex-start; gap: 3px; font-size: 14px; line-height: 18px; font-weight: 700; color: var(--accent-ink); }
.bk-time { white-space: nowrap; }
.bk-time .bk-ico { width: 15px; height: 15px; }
.bk-table.is-open { background: var(--accent-tint); border-color: var(--accent-strong); }
.bk-table.is-long { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.bk-table.is-long .bk-time { padding: 1px 6px 1px 4px; border-radius: var(--radius-pill); background: var(--danger); color: var(--on-brand); }
.bk-table__other { position: absolute; top: -9px; right: -7px; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--bg); border-radius: 50%; color: var(--on-brand); }
.bk-table__other .bk-ico { width: 16px; height: 16px; }
.bk-table__other--rice { background: var(--brand); }
.bk-table__other--noodle { background: var(--noodle); }

.bk-take { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk-take__btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap-main); border: 2px dashed var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--brand-dark); font-size: 18px; font-weight: 800; }
.bk-orders { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.bk-order { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 76px; padding: 10px 14px 10px 10px; border: 2px solid var(--accent-strong); border-radius: var(--radius-md); background: var(--accent-tint); text-align: left; }
.bk-order__no { display: grid; place-items: center; min-width: 58px; height: 52px; padding: 0 10px; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font-size: 22px; font-weight: 800; }
.bk-order__name { font-size: 18px; line-height: 24px; font-weight: 700; }
.bk-order__sub { display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--accent-ink); }
.bk-order__sub .bk-ico { width: 18px; height: 18px; }
.bk-order__amount { font-size: 20px; font-weight: 800; color: var(--accent-ink); }

/* ---------- หน้าบิล ---------- */
.bk-billbar { flex: none; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 var(--space-3); background: var(--brand); color: var(--on-brand); }
.bk-billbar__title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.bk-billbar__table { font-size: 24px; line-height: 28px; font-weight: 800; white-space: nowrap; }
.bk-billbar__avatar { flex: none; width: var(--tap-min); height: var(--tap-min); display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 800; }

.bk-tools { flex: none; display: flex; gap: 10px; padding: 12px var(--space-4) 8px; }
.bk-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: var(--tap-min); padding: 0 14px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink-muted); font-size: 17px; }
.bk-custom { flex: none; display: flex; align-items: center; gap: 6px; height: var(--tap-min); padding: 0 14px 0 10px; border: 0; border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 800; }

.bk-cats { flex: none; display: flex; gap: var(--space-2); overflow-x: auto; padding: 4px var(--space-4) 10px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
.bk-cat { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; height: var(--tap-min); padding: 0 18px; border: 2px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); font-size: 17px; font-weight: 700; white-space: nowrap; }
.bk-cat.is-active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.bk-cat--all { width: var(--tap-min); padding: 0; border-color: var(--accent-strong); background: var(--accent-tint); color: var(--accent-ink); }

.bk-menu { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: min-content; gap: 10px; padding: 10px var(--space-4) var(--space-4); align-content: start; }
.bk-item { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 84px; padding: 11px 13px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); text-align: left; }
.bk-item:active { background: var(--brand-wash); }
.bk-item__name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 17px; line-height: 22px; font-weight: 600; }
.bk-item__price { align-self: flex-end; font-size: 20px; line-height: 24px; font-weight: 800; color: var(--brand); }
.bk-item.is-added { border-color: var(--accent-strong); background: var(--accent-tint); }
.bk-item__qty { position: absolute; top: -9px; right: -6px; min-width: 32px; height: 32px; padding: 0 8px; display: grid; place-items: center; border: 2px solid var(--bg); border-radius: 16px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 800; }

.bk-toast { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; margin: 0 var(--space-3) 10px; padding: 6px 6px 6px 14px; border-radius: var(--radius-md); background: var(--ink); color: var(--on-brand); font-size: 17px; line-height: 22px; font-weight: 600; }
.bk-toast__label { display: block; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--line); }
.bk-toast__undo { flex: none; margin-left: auto; height: 40px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font-weight: 800; }
.bk-send { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; margin: 0 var(--space-3) 10px; border: 0; border-radius: var(--radius-md); background: var(--noodle); color: var(--on-brand); font-size: 18px; font-weight: 800; }

.bk-actionbar { flex: none; display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-3); background: var(--surface); border-top: 2px solid var(--line); box-shadow: var(--shadow-sheet); }
.bk-sumbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: var(--tap-main); padding: 0 6px; border: 0; background: none; text-align: left; }
.bk-sumbtn__n { display: block; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
.bk-sumbtn__total { display: block; font-size: 32px; line-height: 34px; font-weight: 800; }
.bk-sumbtn .bk-ico { margin-left: auto; color: var(--ink-muted); }

/* ---------- ป็อบอัพจากล่าง (bottom sheet) ---------- */
.bk-scrim { position: absolute; inset: 0; background: var(--scrim); }
.bk-sheet { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; max-height: 88%; padding: 10px var(--space-4) var(--space-4); border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-sheet); }
.bk-sheet__grab { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line-strong); }
.bk-sheet__title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 22px; line-height: 28px; font-weight: 800; }
.bk-sheet__price { color: var(--brand); }
.bk-sheet__scroll { min-height: 0; overflow-y: auto; }
.bk-label { display: block; margin-bottom: 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink-muted); }
.bk-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk-opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 0 14px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 17px; font-weight: 700; text-align: left; }
.bk-opt__name { display: flex; align-items: center; gap: 6px; }
.bk-opt__plus { color: var(--brand); font-weight: 800; }
.bk-opt .bk-ico { display: none; }
.bk-opt.is-on { border-color: var(--accent-strong); background: var(--accent-tint); color: var(--accent-ink); }
.bk-opt.is-on .bk-opt__plus { color: var(--accent-ink); }
.bk-opt.is-on .bk-ico { display: block; }
.bk-row { display: flex; align-items: center; gap: 10px; }
.bk-stepper { display: flex; align-items: center; gap: var(--space-2); }
.bk-stepper__btn { width: var(--tap-main); height: var(--tap-main); display: grid; place-items: center; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); }
.bk-stepper__btn--sm { width: var(--tap-min); height: var(--tap-min); }
.bk-stepper__val { min-width: 52px; text-align: center; font-size: 28px; line-height: 32px; font-weight: 800; }
.bk-field { width: 100%; height: 52px; padding: 0 14px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; }
.bk-field::placeholder { color: var(--ink-muted); }
.bk-field--short { width: 128px; flex: none; }
.bk-quick { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.bk-quick__chip { height: var(--tap-min); padding: 0 16px; border: 2px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); font-size: 16px; font-weight: 700; }

/* ---------- รายการในบิล ---------- */
.bk-lines { display: flex; flex-direction: column; }
.bk-line { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; min-height: 76px; padding: 12px 0; border-bottom: 2px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.bk-line:last-child { border-bottom: 0; }
.bk-line__name, .bk-line__sum, .bk-line__qty, .bk-order__name { display: block; }
.bk-line__name { font-size: 18px; line-height: 24px; font-weight: 700; }
.bk-line__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; color: var(--ink-muted); }
.bk-line__sum { font-size: 20px; line-height: 24px; font-weight: 800; text-align: right; }
.bk-line__qty { font-size: 15px; line-height: 20px; color: var(--ink-muted); text-align: right; }
.bk-total { display: flex; align-items: baseline; justify-content: space-between; padding-top: 6px; font-size: 20px; font-weight: 700; }
.bk-total__sum { font-size: 32px; line-height: 36px; font-weight: 800; }

/* ---------- จอใหญ่ (แท็บเล็ต / คอม) แบ่ง 3 ส่วน: หมวด | เมนู | บิล ---------- */
.bk-split { flex: 1; min-height: 0; display: grid; grid-template-columns: 176px 1fr 380px; }
.bk-rail { overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); background: var(--surface); border-right: 2px solid var(--line); }
.bk-rail .bk-cat { width: 100%; justify-content: flex-start; border-radius: var(--radius-md); }
.bk-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.bk-menu--wide { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
.bk-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 2px solid var(--line); }
.bk-panel__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px var(--space-4) 10px; }
.bk-panel__body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-4); }
.bk-panel__foot { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px var(--space-4) var(--space-4); border-top: 2px solid var(--line); box-shadow: var(--shadow-sheet); }
.bk-panel__foot .bk-send { margin: 0; }
.bk-board { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 340px; gap: var(--space-5); padding: var(--space-5); overflow: hidden; }
.bk-board .bk-zone { margin-top: 0; }
.bk-board .bk-tables { grid-template-columns: repeat(4, 1fr); }

/* ---------- ชำระเงิน ---------- */
.bk-pay { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px var(--space-4) var(--space-4); }
.bk-due { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bk-due__label { font-size: 20px; line-height: 26px; font-weight: 800; }
.bk-due__sub { display: block; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink-muted); }
.bk-due__sum { font-size: 48px; line-height: 52px; font-weight: 800; color: var(--brand); }
.bk-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk-method { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 20px; font-weight: 800; }
.bk-method.is-active { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.bk-field--big { height: 64px; font-size: 30px; line-height: 36px; font-weight: 800; text-align: right; }
.bk-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-top: 10px; }
.bk-amount { min-height: 52px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 18px; font-weight: 800; }
.bk-amount--exact { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-dark); }
.bk-change { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--brand-tint); color: var(--brand-dark); font-size: 20px; font-weight: 800; }
.bk-change__sum { font-size: 44px; line-height: 48px; font-weight: 800; }
.bk-change.is-short { background: var(--danger-tint); color: var(--danger); }
.bk-qr { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); text-align: center; }
.bk-qr__img { width: 224px; height: 224px; padding: 8px; border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.bk-qr__sum { font-size: 32px; line-height: 38px; font-weight: 800; color: var(--brand); }
.bk-qr__who { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink-muted); }
.bk-hint { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--noodle-tint); color: var(--noodle); font-size: 16px; line-height: 22px; font-weight: 600; }
.bk-hint .bk-ico { margin-top: 1px; }
.bk-hint--warn { background: var(--accent-tint); color: var(--accent-ink); box-shadow: inset 0 0 0 2px var(--accent-strong); }
.bk-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: var(--space-5) var(--space-4); text-align: center; }
.bk-done__mark { width: 104px; height: 104px; display: grid; place-items: center; border-radius: 50%; background: var(--brand); color: var(--on-brand); }
.bk-done__mark .bk-ico { width: 56px; height: 56px; stroke-width: 3; }
.bk-done__title { font-size: 32px; line-height: 38px; font-weight: 800; }
.bk-done__facts { width: 100%; display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); text-align: left; }
.bk-fact { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; font-weight: 600; }
.bk-fact b { font-weight: 800; }

/* ---------- ย้าย/รวมโต๊ะ และกล่องยืนยัน ---------- */
.bk-table.is-current { border-style: dashed; border-color: var(--line-strong); background: var(--bg); }
.bk-table.is-current .bk-table__no { color: var(--ink-muted); }
.bk-table.is-selected { border-color: var(--brand-dark); background: var(--brand); color: var(--on-brand); box-shadow: 0 0 0 3px var(--accent); }
.bk-table.is-selected .bk-table__no, .bk-table.is-selected .bk-table__amount, .bk-table.is-selected .bk-table__state { color: var(--on-brand); }
.bk-table__tag { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; line-height: 18px; font-weight: 700; color: var(--accent-ink); white-space: nowrap; }
.bk-table.is-selected .bk-table__tag { color: var(--on-brand); }
.bk-table__tag .bk-ico { width: 15px; height: 15px; }
.bk-dialog { position: absolute; left: 20px; right: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sheet); }
.bk-dialog--wide { left: 50%; right: auto; width: 520px; transform: translate(-50%, -50%); }
.bk-dialog__title { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 22px; line-height: 28px; font-weight: 800; }
.bk-dialog__text { margin: 0; font-size: 17px; line-height: 24px; color: var(--ink-muted); }
.bk-dialog__text b { color: var(--ink); }
.bk-btn--fill-danger { background: var(--danger); color: var(--on-brand); }
.bk-btn--main, .bk-btn--fill-danger { min-height: var(--tap-main); }

/* ---------- แป้นตัวเลข (รหัสตั้งค่า / ราคาเอง) ---------- */
.bk-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bk-key { height: 64px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 28px; font-weight: 800; }
.bk-key--fn { background: var(--bg); font-size: 18px; }
.bk-pin { display: flex; justify-content: center; gap: 16px; margin: 4px 0 8px; }
.bk-pin i { width: 20px; height: 20px; border: 3px solid var(--brand); border-radius: 50%; }
.bk-pin i.is-on { background: var(--brand); }
.bk-priceview { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; min-height: 64px; padding: 8px 16px; border: 2px solid var(--brand); border-radius: var(--radius-md); background: var(--surface); font-size: 40px; line-height: 46px; font-weight: 800; }
.bk-priceview small { font-size: 20px; color: var(--ink-muted); font-weight: 700; }
.bk-staffbtn { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 0 16px 0 10px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 22px; font-weight: 800; text-align: left; }
.bk-staffbtn.is-active { border-color: var(--brand); background: var(--brand-wash); }
.bk-staffbtn__av { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 22px; font-weight: 800; }
.bk-catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bk-catgrid .bk-cat { height: 60px; border-radius: var(--radius-md); white-space: normal; text-align: center; line-height: 22px; }
.bk-result { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; min-height: 68px; padding: 10px 14px; border: 2px solid var(--line); border-radius: var(--radius-md); background: var(--surface); text-align: left; }
.bk-result__name { font-size: 18px; line-height: 24px; font-weight: 700; }
.bk-result__cat { font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
.bk-result__price { grid-row: 1 / span 2; grid-column: 2; font-size: 22px; font-weight: 800; color: var(--brand); }
.bk-search.is-focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); color: var(--ink); }
.bk-search__clear { margin-left: auto; height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: var(--bg); font-size: 15px; font-weight: 700; }
.bk-order.is-late { border-color: var(--danger); background: var(--danger-tint); }
.bk-order.is-late .bk-order__sub, .bk-order.is-late .bk-order__amount { color: var(--danger); }
.bk-order.is-done { border-color: var(--line); background: var(--bg); opacity: 1; }
.bk-order.is-done .bk-order__no { background: var(--line); color: var(--ink-muted); }
.bk-order.is-done .bk-order__sub, .bk-order.is-done .bk-order__amount, .bk-order.is-done .bk-order__name { color: var(--ink-muted); }
.bk-tag--cancel { background: var(--danger-tint); color: var(--danger); }
.bk-tag--late { background: var(--danger); color: var(--on-brand); }
.bk-chip--take { background: var(--accent-tint); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--accent-strong); }
.bk-subbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px var(--space-4); background: var(--accent-tint); color: var(--accent-ink); font-size: 16px; font-weight: 700; }

/* ---------- รายงาน ---------- */
.bk-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk-kpi { padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bk-kpi__label { font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
.bk-kpi__value { font-size: 28px; line-height: 34px; font-weight: 800; }
.bk-kpi--main { grid-column: 1 / -1; background: var(--brand); color: var(--on-brand); }
.bk-kpi--main .bk-kpi__label { color: var(--brand-tint); }
.bk-kpi--main .bk-kpi__value { font-size: 44px; line-height: 50px; }
.bk-card { padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bk-card__title { margin-bottom: 8px; font-size: 18px; line-height: 24px; font-weight: 800; }
.bk-card__note { margin-top: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink-muted); }
.bk-lite { width: 100%; border-collapse: collapse; }
.bk-lite th { padding: 4px 0 6px; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-muted); text-align: left; }
.bk-lite td { padding: 9px 0; border-top: 2px solid var(--line); font-size: 17px; line-height: 22px; font-weight: 600; }
.bk-lite .num { text-align: right; font-variant-numeric: tabular-nums; }
.bk-lite tr.is-total td { font-weight: 800; }
.bk-bar { height: 12px; margin-top: 6px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.bk-bar > i { display: block; height: 100%; border-radius: 6px; background: var(--brand); }
.bk-bar--noodle > i { background: var(--noodle); }
.bk-check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--brand-dark); }
.bk-dash { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; padding: var(--space-5); overflow: hidden; align-content: start; }
.bk-dash__col { display: grid; gap: 12px; align-content: start; }

/* ---------- ตั้งค่า ---------- */
.bk-acc { border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.bk-acc + .bk-acc { margin-top: 10px; }
.bk-acc__head { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 60px; padding: 0 16px; border: 0; background: none; font-size: 19px; font-weight: 800; text-align: left; }
.bk-acc__count { margin-left: auto; min-width: 34px; height: 30px; padding: 0 10px; display: grid; place-items: center; border-radius: 15px; background: var(--bg); font-size: 15px; font-weight: 800; }
.bk-acc__body { display: grid; gap: 12px; padding: 12px 16px 16px; border-top: 2px solid var(--line); }
.bk-acc__head .bk-ico:last-child { margin-left: 8px; color: var(--ink-muted); }
.bk-acc__count + .bk-ico { margin-left: 4px; }
.bk-mrow { display: grid; grid-template-columns: 1fr 92px; gap: 8px; padding: 12px 0; border-bottom: 2px solid var(--line); }
.bk-mrow:last-child { border-bottom: 0; }
.bk-mrow__tools { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bk-smallbtn { height: var(--tap-min); min-width: var(--tap-min); padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); font-size: 16px; font-weight: 700; }
.bk-smallbtn--danger { border-color: var(--danger); color: var(--danger); background: var(--danger-tint); }
.bk-btn--dirty { background: var(--accent); color: var(--on-accent); }
.bk-dirtynote { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--accent-ink); }
.bk-settings-wide { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px 1fr; }
.bk-navlist { padding: var(--space-3); display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-right: 2px solid var(--line); }
.bk-navitem { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border: 2px solid transparent; border-radius: var(--radius-md); background: none; font-size: 18px; font-weight: 700; text-align: left; }
.bk-navitem.is-active { background: var(--brand-tint); color: var(--brand-dark); border-color: var(--brand); }
.bk-grid-edit { display: grid; grid-template-columns: 1fr 160px 120px 140px auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 2px solid var(--line); }
.bk-grid-edit--head { padding: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-muted); border-bottom: 0; }

/* ---------- เครื่องพิมพ์ใบสั่ง ---------- */
.bk-pstat { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius-md); background: var(--brand-tint); color: var(--brand-dark); font-size: 22px; line-height: 28px; font-weight: 800; }
.bk-pstat small { display: block; font-size: 16px; line-height: 22px; font-weight: 600; }
.bk-pstat.is-bad { background: var(--danger); color: var(--on-brand); }
.bk-pstat__mark { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--brand); color: var(--on-brand); }
.bk-pstat.is-bad .bk-pstat__mark { background: var(--on-brand); color: var(--danger); }
.bk-slip { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bk-slip__title { font-size: 19px; line-height: 24px; font-weight: 800; }
.bk-slip__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; color: var(--ink-muted); font-weight: 600; }
.bk-slip__btns { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }
.bk-counter { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- กระดาษความร้อน 58 มม. (ขาวดำล้วน กว้าง 384 จุด) ---------- */
.sl-paper { box-sizing: border-box; width: 384px; padding: 16px 14px 24px; background: #fff; color: #000; font-family: var(--font-sans); font-size: 22px; line-height: 30px; }
.sl-paper * { box-sizing: border-box; }
.sl-center { text-align: center; }
.sl-small { font-size: 20px; line-height: 26px; }
.sl-h { font-size: 32px; line-height: 40px; font-weight: 800; }
.sl-big { font-size: 120px; line-height: 112px; font-weight: 800; }
.sl-mid { font-size: 76px; line-height: 84px; font-weight: 800; }
.sl-bar { margin: 8px 0; padding: 6px 0; background: #000; color: #fff; text-align: center; font-size: 36px; line-height: 44px; font-weight: 800; }
.sl-hr { height: 0; margin: 10px 0; border: 0; border-top: 3px dashed #000; }
.sl-row { display: flex; justify-content: space-between; gap: 8px; }
.sl-row b { font-weight: 800; }
.sl-line { display: flex; gap: 10px; font-size: 27px; line-height: 36px; font-weight: 800; }
.sl-line span:first-child { min-width: 52px; }
.sl-note { padding-left: 62px; font-size: 22px; line-height: 28px; font-weight: 600; }
.sl-box { border: 4px solid #000; padding: 6px; text-align: center; font-size: 30px; line-height: 38px; font-weight: 800; }
.sl-total { font-size: 36px; line-height: 44px; font-weight: 800; }
.sl-paper--form { width: 100%; }
.sl-blank { height: 46px; border-bottom: 2px solid #000; }
.sl-cols { display: grid; grid-template-columns: 52px 1fr 90px 100px; font-size: 20px; font-weight: 800; border-bottom: 3px solid #000; }
.sl-cols span { padding: 4px 6px; }
.sl-box-sq { display: inline-block; width: 24px; height: 24px; margin: 0 6px -4px 0; border: 3px solid #000; }


/* ---------- ต่อระบบดีไซน์เข้ากับหน้าเว็บจริง ---------- */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
#app{height:100vh;height:100dvh}
.bk-appbar{position:relative;z-index:5}
.bk-right{display:flex;align-items:center;gap:10px}
.bk-saving{font-size:14px;line-height:18px;font-weight:700;color:var(--on-brand);opacity:.9}
.bk-saving:empty{display:none}
.bk-brand__pos{display:none}
.bk-brand{white-space:nowrap}
.bk-body.legacy{width:100%;max-width:720px;margin:0 auto;padding-bottom:90px}
.bk-table[disabled]{opacity:.6}
.bk-table.is-open .bk-table__state{color:var(--accent-ink);font-weight:700}
.bk-loading{padding:40px 0;text-align:center;color:var(--ink-muted);font-weight:600}
.bk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.is-bill .bk-tabbar{display:none}
@media (max-width:899px){.bk-topnav{display:none}.bk-zone.is-hidden{display:none}}
@media (min-width:900px){
  .bk-tabbar{display:none}
  .bk-appbar{padding-left:var(--space-5);padding-right:var(--space-5)}
  .bk-brand__pos{display:inline}
  .bk-body{padding:var(--space-5)}
  .bk-body.legacy{padding:var(--space-4) var(--space-4) 90px}
  #zones{display:grid;grid-template-columns:repeat(var(--zn,2),minmax(0,1fr));gap:var(--space-5);align-items:start}
  #zones .bk-zone{margin-top:0}
  #zones .bk-tables{grid-template-columns:repeat(4,1fr)}
  .bk-stats,.bk-seg{display:none}
}


/* ---------- หน้าบิล / ป็อบอัพ ---------- */
[hidden]{display:none!important}
#layer:empty{display:none}
.bk-scrim,.bk-sheet,.bk-dialog{z-index:30}
.bk-sheet{overflow-y:auto}
.bk-sheet--tight{gap:10px}
.bk-dialog{max-height:92%;overflow-y:auto}
.bk-body.is-billpage{padding:0;overflow:hidden;display:flex;flex-direction:column}
.bk-billpage{flex:1;min-height:0;display:flex;flex-direction:column}
.bk-billpage>.bk-main{flex:1}
.bk-rail,.bk-panel{display:none}
.bk-iconbtn--soft{background:var(--bg);color:var(--ink)}
.bk-search{cursor:text}
.bk-search input{flex:1;min-width:0;width:auto;height:100%;margin:0;padding:0;border:0;border-radius:0;background:none;font:inherit;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.bk-search input::placeholder{color:var(--ink-muted)}
.bk-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);color:var(--ink)}
.bk-results{flex:1;min-height:0;overflow-y:auto;display:grid;gap:10px;align-content:start;padding:4px var(--space-4) var(--space-4)}
.bk-nomargin{margin:0}
.bk-span{grid-column:1/-1}
.bk-menu .bk-loading{padding:24px 0}
.bk-quick__chip.is-on{background:var(--accent-tint);border-color:var(--accent-strong);color:var(--accent-ink)}
.bk-btn--tall{min-height:var(--tap-main)}
.bk-btn--grow{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.bk-btn--pay{min-width:164px}
.bk-btn--stay{color:var(--brand-dark)}
.bk-send--rice{background:var(--brand)}
.bk-send--flat{margin:0}
.bk-ink{color:var(--ink)}
.bk-grow{flex:1;min-width:0}
.bk-small{margin:0;font-size:16px;line-height:22px}
.bk-big{font-size:20px}
.bk-mt{margin-top:4px}
.bk-val40{min-width:40px}
.bk-flush{padding:0}
.bk-sum28{font-size:28px}
.bk-line.is-tmp{opacity:.6}
.bk-staffbtn{width:100%}
.bk-staffbtn__ok{margin-left:auto;color:var(--brand)}
#toast{bottom:100px}
@media (max-width:899px){.is-bill .bk-appbar{display:none}}
@media (min-width:900px){
  .bk-billpage{display:grid;grid-template-columns:176px minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
  .bk-billbar,.bk-billpage>.bk-send,.bk-billpage>.bk-actionbar,.bk-cats{display:none}
  .bk-rail,.bk-panel{display:flex}
  .bk-menu{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
  .bk-sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:90%;transform:translate(-50%,-50%);border-radius:var(--radius-lg)}
  .bk-dialog{left:50%;right:auto;width:520px;transform:translate(-50%,-50%)}
}


/* ---------- ชำระเงิน ---------- */
.bk-payscreen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.bk-payscreen .paytitle{display:none}
.bk-payscreen .bk-actionbar{flex-direction:column;align-items:stretch}
.is-bill .bk-payscreen .bk-appbar{display:flex}
.bk-qr__img{image-rendering:pixelated}
@media (min-width:900px){
  .bk-payscreen{inset:auto;left:50%;top:50%;width:520px;max-height:92%;transform:translate(-50%,-50%);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sheet)}
  .bk-payscreen .bk-billbar,.is-bill .bk-payscreen .bk-appbar{display:none}
  .bk-payscreen .paytitle{display:flex;padding:16px 20px 0}
  .bk-payscreen .bk-actionbar{box-shadow:none}
}

.bk-payscreen .bk-actionbar .bk-hint{padding:8px 12px}
.bk-payscreen .bk-body{flex:1;min-height:0}

/* ---------- รายงาน ---------- */
.bk-rwrap,.bk-rcol,.bk-rctl{display:flex;flex-direction:column;gap:12px}
.bk-mt12{margin-top:12px}
.bk-between{justify-content:space-between}
.bk-b20{font-size:20px}
.bk-sub{display:block;font-size:14px;line-height:18px;font-weight:600;color:var(--ink-muted)}
.bk-hide-m{display:none}
.bk-check.is-bad{padding:8px 12px;border-radius:var(--radius-md);background:var(--danger-tint);color:var(--danger)}
.bk-rwrap .bk-dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start;padding:0;overflow:visible;flex:none}
.bk-rctl .bk-quick .bk-cat{flex:none}
.bk-dates>*,.bk-rctl .bk-field{min-width:0}
@media (min-width:900px){
  .bk-rctl{flex-direction:row;flex-wrap:wrap;align-items:center}
  .bk-rctl .bk-quick,.bk-rctl .bk-dates,.bk-rctl .rsel{display:contents}
  .bk-rctl .bk-field{width:auto}
  #rf,#rt{width:170px}
  #rg{width:200px;flex:none}
  .bk-hide-m{display:table-cell}
}

/* ---------- ตั้งค่า ---------- */
.bk-acclist{display:flex;flex-direction:column}
.bk-erow{display:grid;gap:8px;padding:12px 0;border-bottom:2px solid var(--line)}
.bk-erow:last-child{border-bottom:0}
.bk-mrow__tools{flex-wrap:wrap}
.bk-fieldsm{height:48px}
.bk-mrow .bk-fieldsm{flex:1 1 150px;min-width:150px;width:auto}
.bk-shoptag{display:inline-flex}
.bk-smallbtn[disabled]{opacity:.35}
.bk-center{text-align:center}
.bk-t22{font-size:22px}
.bk-t24{margin:0;font-size:24px}
.bk-card0{padding:0 14px}
.bk-pinpage{max-width:420px;margin:0 auto;align-items:stretch;padding:24px 0 0}
#stbar{flex-direction:column;align-items:stretch;gap:8px}
.bk-spanel{display:flex;flex-direction:column;min-height:0}
.bk-sphead{padding:16px 24px;gap:12px}
.bk-spbody{flex:1;min-height:0;overflow-y:auto;padding:0 24px 24px}
.bk-spform{display:grid;gap:12px;max-width:560px}
.bk-w176{width:176px}
.bk-tools-w{gap:6px}
.bk-search--max{max-width:320px;margin-left:auto;flex:1}
.bk-grid-edit .bk-field,.bk-acc__body .bk-field,.bk-mrow .bk-field{min-width:0}
.bk-acc__head>span:first-child{text-align:left}
@media (min-width:900px){
  #stbar{flex-direction:row;align-items:center}
  #stbar .bk-dirtynote{margin-right:auto}
  #stbar .bk-btn{min-width:240px}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
h3{margin:14px 0 8px;font-size:17px}
.zone{font-weight:700;margin:14px 0 6px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tbl{border:2px solid #d8d2c4;background:#fff;border-radius:12px;padding:10px 4px;text-align:center;font:inherit;min-height:74px}
.tbl b{display:block;font-size:20px}
.tbl small{color:#888}
.tbl.occ{background:#fff3c9;border-color:#e0a800}
.tbl.occ small{color:#8a5a00;font-weight:700}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.top{display:flex;align-items:center;gap:10px}
.top .back{border:0;background:#e9e4d6;border-radius:10px;padding:10px 14px;font:inherit}
.top .t{flex:1}
.top .t b{font-size:21px}
.top .t small{color:#777;display:block}
.total{font-size:30px;font-weight:800;color:#2f6b3f}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
@media (min-width:700px){.cats{flex-wrap:wrap}}
.cat{flex:none;padding:12px 16px;border-radius:12px;border:2px solid #d8d2c4;background:#fff;font:inherit;font-weight:700}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:10px;border:2px solid #ecdcb4;background:#fff8e6;border-radius:10px;font:inherit;font-size:15px;font-weight:700;color:#5a3d00}
.mi b{color:#2f6b3f;white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.opt{padding:12px 16px;border-radius:12px;border:2px solid #d8d2c4;background:#fff;font:inherit;font-weight:700}
.opt b{color:#2f6b3f}
.opt.on{background:#2f6b3f;border-color:#2f6b3f;color:#fff}
.opt.on b{color:#fff}
.cat.on{background:#2f6b3f;border-color:#2f6b3f;color:#fff}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
input,select{font:inherit;padding:12px;border:2px solid #d8d2c4;border-radius:10px;width:100%;background:#fff}
input.big{font-size:28px;font-weight:800;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:48px;border-radius:10px;border:2px solid #d8d2c4;background:#fff;font-size:22px;font-weight:800}
.qty input{width:62px;text-align:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid #2f6b3f;color:#2f6b3f;background:#fff;font:inherit;font-weight:700}
.chip.q{border-color:#c77d00;color:#8a5a00;background:#fff8e6}
.btn{padding:14px;border:0;border-radius:12px;font:inherit;font-weight:800;color:#fff;background:#2f6b3f;width:100%;font-size:18px}
.btn.gray{background:#8b8574}
.btn.red{background:#b3372b}
.btn.orange{background:#c77d00}
.sent{color:#2f6b3f;font-weight:700}
.wait{color:#c77d00;font-weight:700}
.btn.sm{padding:10px 14px;width:auto;font-size:15px}
.btn:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid #eee}
.item:last-child{border:0}
.item.tmp{opacity:.6}
.item .n small{display:block;color:#888}
.item .a{font-weight:800;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px;display:flex;gap:8px;box-shadow:0 -2px 8px #0002}
.bar .btn{flex:1}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:20px}
.lbl{font-size:14px;color:#666;margin:10px 0 4px}
.pay{display:flex;gap:8px}
.pay button{flex:1;padding:14px;border-radius:12px;border:2px solid #d8d2c4;background:#fff;font:inherit;font-weight:800}
.pay button.on{background:#2f6b3f;color:#fff;border-color:#2f6b3f}
.qr{text-align:center;margin-top:10px}
.qr img{width:240px;max-width:80%;height:auto;image-rendering:pixelated}
.qrAmt{font-size:26px;font-weight:800;color:#2f6b3f}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.g{font-size:26px;font-weight:800;color:#2f6b3f}
.tab{width:100%;border-collapse:collapse;font-size:15px}
.tab th,.tab td{padding:8px 6px;border-bottom:1px solid #eee;text-align:right}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab th{background:#faf8f2}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#fff;border-radius:12px;padding:10px}
.kpi small{color:#777;display:block}
.kpi b{font-size:21px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:40;display:none;max-width:90%}
#toast.err{background:#b3372b}
.muted{color:#888;text-align:center;padding:20px}
details.set{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
details.set summary{padding:14px 12px;font-weight:800;cursor:pointer}
details.set .in{padding:0 12px 12px}
.er{display:flex;gap:6px;margin-top:6px;align-items:center}
.er input,.er select{padding:10px 8px;min-width:0;font-size:15px}
.er .x{flex:none;width:34px;height:44px;border:0;border-radius:10px;background:#f3e1de;color:#b3372b;font-size:18px;font-weight:800}
.eh{display:flex;gap:5px;font-size:13px;color:#777;margin-top:4px;padding-right:72px}
.er{gap:5px}
.er input,.er select{font-size:14px;padding:10px 6px}
.ud{flex:none;display:flex;flex-direction:column;gap:2px}
.ud button{width:28px;height:21px;border:0;border-radius:6px;background:#e9e4d6;color:#555;font-size:11px;line-height:1;padding:0}
.ud button:disabled{opacity:.3}
.eh span,.er>input,.er>select{flex:1}

<nav class="bk-tabbar" aria-label="เมนูหลัก"><button class="bk-tab is-active" data-v="board"><svg class="bk-ico bk-ico--lg" aria-hidden="true"><use href="#i-table"/></svg>โต๊ะ</button><button class="bk-tab" data-v="report"><svg class="bk-ico bk-ico--lg" aria-hidden="true"><use href="#i-chart"/></svg>รายงาน</button><button class="bk-tab" data-v="settings"><svg class="bk-ico bk-ico--lg" aria-hidden="true"><use href="#i-sliders"/></svg>ตั้งค่า</button></nav>
<div id="layer"></div>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
var S = { cfg: null, staff: '', view: 'board', zoneF: '', billId: null, bill: null, cat: null, slip: '', board: {}, timer: null, busy: false, ops: 0, chain: Promise.resolve() };
// หน้าชำระเงินที่เปิดอยู่ (ให้ยอดอัปเดตตามเมื่อเพิ่ม/ลบรายการระหว่างคิดเงิน)
var PAY = { on: false, refresh: null };

function api(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run
      .withSuccessHandler(function (x) { netState(true); res(x); })
      .withFailureHandler(function (e) { if (isNetErr(e)) netState(false); rej(e); });
    if (typeof r[fn] !== 'function') { rej(new Error('เซิร์ฟเวอร์ไม่มีคำสั่ง ' + fn + ' — Code.gs ที่ Deploy อยู่อาจเป็นเวอร์ชันเก่า')); return; }
    r[fn].apply(r, args);
  });
}
function $(s) { return document.querySelector(s); }
// เน็ตหลุด: ขึ้นป้ายแดงให้เปลี่ยนไปใช้บิลกระดาษสำรอง หายเองเมื่อเรียกเซิร์ฟเวอร์สำเร็จอีกครั้ง
function netState(ok) { var el = $('#offline'); if (el) el.style.display = ok ? 'none' : 'flex'; }
function isNetErr(e) {
  var offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  return offline || /network|HTTP 0|connection|failed to fetch/i.test(String(e && e.message || e));
}
window.addEventListener('offline', function () { netState(false); });
window.addEventListener('online', function () { if (S.view === 'board') loadBoard(true); });
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 }); }
function toast(msg, err) {
  var t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, err ? 4000 : 1800);
}
function fail(e) {
  S.busy = false;
  if (isNetErr(e)) { toast('ไม่มีอินเทอร์เน็ต บันทึกไม่สำเร็จ', true); return; }
  toast((e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''), true);
}
function ymd(d) { var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// บันทึกแบบไม่ต้องรอ: แก้บนจอทันที แล้วส่งไปบันทึกที่ชีตทีละรายการตามลำดับ
// ถ้าบันทึกไม่สำเร็จ จะแจ้งเตือนแล้วโหลดบิลจริงจากชีตกลับมาแสดง
function save(fn, args, onScreen, onDone) {
  var billId = S.billId;
  if (onScreen) { onScreen(); recalc(); renderBill(true); }
  S.ops++; showSaving();
  S.chain = S.chain.then(function () { return api.apply(null, [fn].concat(args)); }).then(function (r) {
    S.ops--; showSaving();
    var b = r && r.bill ? r.bill : r;
    if (!S.ops && b && b.billId === S.billId && S.view === 'bill') { S.bill = b; renderBill(true); }
    if (onDone) onDone(r);
  }, function (e) {
    S.ops--; showSaving(); fail(e);
    if (S.billId === billId && S.view === 'bill') loadBill();
  });
}
// รอให้บันทึกที่ค้างอยู่เสร็จก่อน แล้วค่อยเรียกเซิร์ฟเวอร์
function after(fn) { var args = [].slice.call(arguments, 1); return S.chain.then(function () { return api.apply(null, [fn].concat(args)); }); }
function recalc() { S.bill.total = S.bill.items.reduce(function (a, i) { return a + i.price * i.qty; }, 0); }
function showSaving() { $('#saving').textContent = S.ops ? 'กำลังบันทึก…' : ''; }
window.addEventListener('beforeunload', function (e) { if (S.ops || (typeof hasDirty === 'function' && hasDirty())) { e.preventDefault(); e.returnValue = ''; } });

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
// ป็อบอัพยืนยันของแอปเอง (ไม่ใช้ confirm ของเบราว์เซอร์ ที่มีชื่อเว็บภาษาอังกฤษขึ้นมา)
function ask(title, yes, onYes, no, onNo) {
  openModal('<h2>' + title + '</h2><div class="row"><button class="btn gray" id="askNo">' + (no || 'ยกเลิก') + '</button><button class="btn red" id="askYes">' + yes + '</button></div>');
  $('#askNo').onclick = function () { closeModal(); if (onNo) onNo(); };
  $('#askYes').onclick = function () { closeModal(); onYes(); };
}
$('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

/* ---------- start ---------- */
api('getConfig').then(function (cfg) {
  S.cfg = cfg; S.cat = cfg.cats[0] && cfg.cats[0].name;
  S.staff = lsGet('pos_staff');
  if (!S.staff || cfg.staff.indexOf(S.staff) < 0) pickStaff(); else { setStaffBtn(); go('board'); }
}).catch(fail);

// ตัวอักษรในวงกลม: พยัญชนะตัวแรกของชื่อ (ข้ามสระหน้า เช่น เ แ โ)
function initial(name) { var m = String(name || '').match(/[ก-ฮA-Za-z0-9]/); return m ? m[0].toUpperCase() : String(name || '?').charAt(0); }
function setStaffBtn() { $('#staffBtn').innerHTML = '<span class="bk-staff__avatar">' + esc(initial(S.staff)) + '</span>' + esc(S.staff); }
$('#staffBtn').onclick = pickStaff;

[].forEach.call(document.querySelectorAll('[data-v]'), function (b) {
  b.onclick = function () { go(b.dataset.v); };
});
function go(v) {
  if (S.view === 'settings' && hasDirty()) { if (v !== 'settings') { leaveDlg(v); } return; } // มีการแก้ที่ยังไม่บันทึก
  S.view = v; clearInterval(S.timer);
  [].forEach.call(document.querySelectorAll('[data-v]'), function (b) { b.classList.toggle('is-active', b.dataset.v === (v === 'bill' ? 'board' : v)); });
  $('#app').classList.toggle('is-bill', v === 'bill');
  $('#main').classList.remove('legacy');
  $('#main').classList.toggle('is-billpage', v === 'bill');
  $('#main').scrollTop = 0;
  closeLayer(); hideUndo();
  var sb = $('#stbar'); if (sb && v !== 'settings') sb.hidden = true;
  if (v === 'board') { loadBoard(); S.timer = setInterval(function () { if (S.view === 'board' && $('#modal').classList.contains('hidden')) loadBoard(true); }, 12000); }
  else if (v === 'bill') { if (S.bill && S.bill.billId === S.billId) renderBill(); else { $('#main').innerHTML = '<div class="bk-loading">กำลังโหลด...</div>'; loadBill(); } }
  else if (v === 'report') renderReport();
  else if (v === 'settings') openSettings();
}

/* ---------- board ---------- */
function loadBoard(silent) {
  if (!silent) $('#main').innerHTML = '<div class="bk-loading">กำลังโหลด...</div>';
  after('getBoard').then(function (b) { S.board = (b && b.board) || {}; if (S.view === 'board') renderBoard(); }).catch(function (e) {
    fail(e);
    if (S.view === 'board' && !$('#zones')) {
      $('#main').innerHTML = '<div class="bk-loading">โหลดข้อมูลไม่สำเร็จ<br><br><button class="bk-btn bk-btn--main" id="retry">ลองใหม่</button></div>';
      $('#retry').onclick = function () { loadBoard(); };
    }
  });
}
var BOARD_LONG_MIN = 45; // นั่งนานเกินกี่นาทีขึ้นขอบแดง (ปรับได้โดยเพิ่มแถว longMinutes ในชีต Settings)
function ico(id, cls) { return '<svg class="bk-ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
// ร้านก๋วยเตี๋ยว = เทาน้ำเงิน + ชาม, นอกนั้น = เขียว + ใบไม้
function shopKind(name) { return /ก๋วยเตี๋ยว/.test(name || '') ? 'noodle' : 'rice'; }
function shopIco(kind) { return kind === 'noodle' ? 'i-bowl' : 'i-leaf'; }
function zoneShop(z) { var o = ((S.cfg && S.cfg.zones) || []).filter(function (x) { return x.zone === z; })[0]; return o ? o.shop : ''; }
// กี่นาทีแล้วนับจากเปิดบิล (เวลาในชีตเป็นเวลาไทย yyyy-MM-dd HH:mm:ss)
function minsSince(s) {
  var m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d):(\d\d)/.exec(String(s || ''));
  if (!m) return null;
  return Math.max(0, Math.floor((Date.now() - Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 7, +m[5], +m[6])) / 60000));
}
function minText(m) { return m < 60 ? m + ' น.' : Math.floor(m / 60) + ' ชม.'; }
function longMin() { var n = Number(((S.cfg && S.cfg.settings) || {}).longMinutes); return n > 0 ? n : BOARD_LONG_MIN; }
// หน้าตาของปุ่มโต๊ะหนึ่งปุ่ม
function tableView(t, b) {
  var no = '<span class="bk-table__no">' + esc(t.table) + '</span>';
  if (!b) return { cls: 'bk-table', html: no + '<span class="bk-table__state">ว่าง</span>', label: 'โต๊ะ ' + t.table + ' ว่าง' };
  var m = minsSince(b.openedAt), long = m != null && m > longMin(), o = (b.other || [])[0], k = o ? shopKind(o) : '';
  return {
    cls: 'bk-table is-open' + (long ? ' is-long' : ''),
    html: (o ? '<span class="bk-table__other bk-table__other--' + k + '">' + ico(shopIco(k)) + '</span>' : '') + no +
      (b.count ? '<span class="bk-table__amount">' + fmt(b.total) + '</span>' : '<span class="bk-table__state">เปิดอยู่</span>') +
      (m != null ? '<span class="bk-time">' + ico('i-clock') + minText(m) + '</span>' : ''),
    label: 'โต๊ะ ' + t.table + ' มีบิล ' + (b.count ? fmt(b.total) + ' บาท' : 'ยังไม่มีรายการ') + (m != null ? ' เปิดมา ' + m + ' นาที' : '') + (long ? ' นั่งนาน' : '') + (o ? ' มีรายการของ' + o : '')
  };
}
function boardZones() {
  var zones = [], byZone = {};
  S.cfg.tables.forEach(function (t) { if (!byZone[t.zone]) { byZone[t.zone] = []; zones.push(t.zone); } byZone[t.zone].push(t); });
  return { zones: zones, byZone: byZone };
}
// วาดโครงหน้าโต๊ะครั้งเดียว รอบรีเฟรชถัดไปแก้เฉพาะปุ่มที่เปลี่ยน (ไม่กระพริบ ไม่เลื่อนหน้ากลับขึ้นบน)
function renderBoard() {
  var zs = boardZones();
  var key = zs.zones.map(function (z) { return z + '~' + zoneShop(z) + '~' + zs.byZone[z].map(function (t) { return t.table; }).join(','); }).join('|');
  if (!$('#zones') || $('#zones').dataset.key !== key) {
    $('#main').innerHTML =
      '<div class="bk-stats"><div class="bk-stat"><div class="bk-stat__label">บิลที่เปิดอยู่</div><div class="bk-stat__value" id="stOpen"></div></div>' +
      '<div class="bk-stat"><div class="bk-stat__label">ยอดที่ยังไม่ปิด</div><div class="bk-stat__value" id="stSum"></div></div></div>' +
      '<div class="bk-seg" id="seg"><button class="bk-seg__item" data-z="">ทั้งหมด<span class="bk-seg__count"></span></button>' +
      zs.zones.map(function (z) { return '<button class="bk-seg__item" data-z="' + esc(z) + '">' + esc(z) + '<span class="bk-seg__count"></span></button>'; }).join('') + '</div>' +
      '<div id="zones" data-key="' + esc(key) + '" style="--zn:' + zs.zones.length + '">' + zs.zones.map(function (z) {
        var k = shopKind(zoneShop(z));
        return '<section class="bk-zone" data-z="' + esc(z) + '"><div class="bk-zone__head"><span class="bk-shop bk-shop--' + k + '">' + ico(shopIco(k)) + '</span>' + esc(z) + '<span class="bk-zone__meta"></span></div><div class="bk-tables">' +
          zs.byZone[z].map(function (t) { return '<button class="bk-table" data-t="' + esc(t.table) + '"></button>'; }).join('') + '</div></section>';
      }).join('') + '</div>';
    $('#zones').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('.bk-table') : null;
      if (!b || b.disabled) return;
      b.disabled = true;
      api('openBill', b.dataset.t, S.staff).then(function (r) { S.billId = r.billId; S.bill = r.bill; go('bill'); }).catch(function (e2) { b.disabled = false; fail(e2); });
    };
    $('#seg').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('.bk-seg__item') : null;
      if (b) { S.zoneF = b.dataset.z; patchBoard(); }
    };
  }
  patchBoard();
}
function patchBoard() {
  var zs = boardZones(), open = 0, sum = 0, cnt = {};
  zs.zones.forEach(function (z) { cnt[z] = 0; });
  S.cfg.tables.forEach(function (t) { var b = S.board[t.table]; if (b) { open++; sum += Number(b.total) || 0; cnt[t.zone]++; } });
  var setTxt = function (el, v) { if (el && el.textContent !== v) el.textContent = v; };
  setTxt($('#stOpen'), open + ' บิล'); setTxt($('#stSum'), fmt(sum) + ' ฿');
  if (!S.zoneF || zs.zones.indexOf(S.zoneF) < 0) S.zoneF = '';
  [].forEach.call(document.querySelectorAll('#seg .bk-seg__item'), function (b) {
    b.classList.toggle('is-active', b.dataset.z === S.zoneF);
    setTxt(b.querySelector('.bk-seg__count'), String(b.dataset.z ? cnt[b.dataset.z] : open));
  });
  [].forEach.call(document.querySelectorAll('#zones .bk-zone'), function (s) {
    var z = s.dataset.z;
    s.classList.toggle('is-hidden', !!S.zoneF && S.zoneF !== z);
    setTxt(s.querySelector('.bk-zone__meta'), 'เปิด ' + cnt[z] + ' จาก ' + zs.byZone[z].length + ' โต๊ะ');
  });
  var byName = {}; S.cfg.tables.forEach(function (t) { byName[t.table] = t; });
  [].forEach.call(document.querySelectorAll('#zones .bk-table'), function (el) {
    var t = byName[el.dataset.t]; if (!t) return;
    var v = tableView(t, S.board[t.table]), sig = v.cls + '|' + v.html;
    if (el._sig === sig) return;
    el._sig = sig; el.className = v.cls; el.innerHTML = v.html; el.setAttribute('aria-label', v.label);
  });
}

/* ---------- bill ---------- */
function $$(s) { return [].slice.call(document.querySelectorAll(s)); }
function setTxt(el, v) { if (el && el.textContent !== v) el.textContent = v; }
function loadBill() {
  var id = S.billId;
  after('getBill', id).then(function (b) { if (id !== S.billId) return; S.bill = b; if (S.view === 'bill') renderBill(); }).catch(function (e) { fail(e); go('board'); });
}
function catObj() { return S.cfg.cats.filter(function (c) { return c.name === S.cat; })[0]; }
// หมวด "เพิ่ม" เป็นตัวเลือกในป็อบอัพอย่างเดียว ไม่แสดงเป็นปุ่มหมวด
var ADDON_CAT = 'เพิ่ม';
function catsShown() { return S.cfg.cats.filter(function (x) { return x.name !== ADDON_CAT; }); }
// หมวดนี้ต้องส่งใบสั่งไปครัวไหม (หมวดขายหน้าร้านเช่น เครื่องดื่ม ขนมถ้วย แคปหมู ตั้งเป็น "ไม่" ในหน้าตั้งค่า)
function sendOf(cat) { var c = S.cfg.cats.filter(function (x) { return x.name === cat; })[0]; return !c || c.send !== false; }
// รายการของอีกร้านที่ต้องส่งใบสั่ง
function needsSend(i, b) { return i.shop !== b.homeShop && !i.noSend && sendOf(i.category); }
// รายการของอีกร้านที่ยังไม่ได้ส่งไปพิมพ์
function pendingSend(b) { return b.items.filter(function (i) { return !i.sent && needsSend(i, b); }); }
function sendTargets(pend) { var to = []; pend.forEach(function (i) { if (to.indexOf(i.shop) < 0) to.push(i.shop); }); return to; }
function shopLabel(shop) { return shopKind(shop) === 'noodle' ? 'ก๋วยเตี๋ยว' : 'ข้าว'; }
function doSend(then) {
  var pend = pendingSend(S.bill);
  save('sendToKitchen', [S.billId, S.staff], function () { pend.forEach(function (i) { i.sent = true; }); }, function (r) {
    toast('ส่งแล้ว: ' + r.sent.map(function (x) { return x.shop + ' ' + x.count + ' รายการ'; }).join(', '));
  });
  if (then) then();
}

/* ชั้นป็อบอัพ: bottom sheet และกล่องกลางจอ อยู่ใน #layer ทับหน้าจอ */
function openSheet(html, cls) {
  $('#layer').innerHTML = '<div class="bk-scrim" data-close="1"></div><div class="bk-sheet' + (cls ? ' ' + cls : '') + '"><span class="bk-sheet__grab"></span>' + html + '</div>';
}
function openDialog(html, dismiss) {
  $('#layer').innerHTML = '<div class="bk-scrim"' + (dismiss ? ' data-close="1"' : '') + '></div><div class="bk-dialog" role="dialog">' + html + '</div>';
}
function closeLayer() { var l = $('#layer'); if (l) l.innerHTML = ''; S.sheet = ''; PAY.on = false; }
function closeBtn() { return '<button class="bk-iconbtn bk-iconbtn--soft" data-close="1" aria-label="ปิด">' + ico('i-close') + '</button>'; }
$('#app').addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act],[data-close]') : null;
  if (!t) return;
  if (t.dataset.close) { closeLayer(); return; }
  act(t.dataset.act, t);
});
function act(a, t) {
  if (a === 'back') backBill();
  else if (a === 'staff') pickStaff();
  else if (a === 'dots') dotsSheet();
  else if (a === 'clearq') { clearSearch(); $('#q').focus(); }
  else if (a === 'cat') { if (S.q) clearSearch(); S.cat = t.dataset.c; closeLayer(); drawCats(); drawMenu(); }
  else if (a === 'allcats') catsSheet();
  else if (a === 'custom') customDlg();
  else if (a === 'pick') { var q = S.cfg.quick[t.dataset.q]; if (q) itemDlg(q); }
  else if (a === 'sum') openBillSheet();
  else if (a === 'send') { closeLayer(); doSend(); }
  else if (a === 'pay') { closeLayer(); payDlg(); }
  else if (a === 'move') { closeLayer(); moveDlg(); }
  else if (a === 'line') { if (t.dataset.i) editItem(t.dataset.i); }
  else if (a === 'undo') doUndo();
  else if (a.indexOf('st-') === 0) stAct(a, t); // หน้าตั้งค่า
}

/* ---------- วาดหน้าบิล ---------- */
// โครงหน้าสร้างครั้งเดียวต่อบิล หลังจากนั้นแก้เฉพาะส่วนที่เปลี่ยน (เมนูไม่เด้งกลับขึ้นบน แถบหมวดไม่เลื่อนกลับ)
function renderBill() {
  if (S.view !== 'bill' || !S.bill) return;
  var b = S.bill;
  if (b.status !== 'open') {
    $('#main').innerHTML = '<div id="billclosed"><header class="bk-billbar"><button class="bk-iconbtn" data-act="back" aria-label="กลับ">' + ico('i-back', 'bk-ico--lg') + '</button><div class="bk-billbar__title"><span class="bk-billbar__table">โต๊ะ ' + esc(b.table) + '</span></div></header><div class="bk-loading">บิลนี้ปิดแล้ว (' + esc(b.status) + ')</div></div>';
    return;
  }
  if (!$('#billpage') || $('#billpage').dataset.id !== b.billId + '|' + b.zone) buildBill(); // ย้ายไปโซนอื่นก็วาดโครงใหม่ (ป้ายโซนเปลี่ยน)
  patchBill();
}
function buildBill() {
  var b = S.bill, shown = catsShown(), k = shopKind(zoneShop(b.zone));
  if (shown.length && !shown.some(function (x) { return x.name === S.cat; })) S.cat = shown[0].name;
  S.q = ''; S.sheet = '';
  var chip = '<span class="bk-chip bk-chip--' + k + '">' + ico(shopIco(k), 'bk-ico--sm') + ' ' + esc(b.zone) + '</span>';

/* ---------- เพิ่ม / ยกเลิกทันที ---------- */
function doAdd(p, label, quiet) {
  p.billId = S.billId; p.staff = S.staff;
  if (!(Number(p.price) > 0)) { toast('ใส่ราคาก่อนเพิ่มเข้าบิล', true); return false; }
  if (!(Number(p.qty) >= 1) || Number(p.qty) % 1) { toast('จำนวนต้องเป็นจำนวนเต็ม', true); return false; }
  var cat = S.cfg.cats.filter(function (c) { return c.name === p.category; })[0];
  var tmp = { itemId: '', tmp: true, category: p.category, shop: cat ? cat.shop : '', name: p.name || '', price: Number(p.price), qty: Number(p.qty), note: p.note || '', slipNo: p.slipNo || '', sent: false, noSend: !!cat && cat.send === false };
  var u = quiet ? null : showUndo(label || p.name || p.category, 'add');

  // รหัสของรายการที่เพิ่งเพิ่ม = รายการสุดท้ายในบิลที่เซิร์ฟเวอร์ตอบกลับ ที่ยังไม่มีบนจอก่อนกดเพิ่ม (ไว้ใช้ตอนกดยกเลิก)

function doUndo() {

/* ---------- QR พร้อมเพย์ ---------- */
// ข้อความใน QR ตามมาตรฐาน Thai QR Payment (EMVCo) ใส่ยอดเงินไว้ ลูกค้าสแกนแล้วไม่ต้องพิมพ์ยอดเอง
function ppPayload(id, amount) {
  id = String(id || '').replace(/\D/g, '');
  function f(tag, v) { return tag + ('0' + v.length).slice(-2) + v; }
  var target = id.length >= 15 ? f('03', id)                                   // e-wallet
    : id.length === 13 ? f('02', id)                                           // เลขผู้เสียภาษี / บัตรประชาชน
    : f('01', ('0000000000000' + id.replace(/^0/, '66')).slice(-13));          // เบอร์มือถือ 08x → 006608x
  var s = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + target) +
    f('58', 'TH') + f('53', '764') + (amount ? f('54', amount.toFixed(2)) : '') + '6304';
  return s + crc16(s);
}
function crc16(s) {
  var c = 0xFFFF;
  for (var i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (var j = 0; j < 8; j++) c = (c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1) & 0xFFFF;
  }
  return ('000' + c.toString(16).toUpperCase()).slice(-4);
}
// เลขพร้อมเพย์บนจอแสดงแค่ 4 ตัวท้าย
function maskId(id) { return 'xxx-xxx-' + String(id || '').replace(/\D/g, '').slice(-4); }
function qrBox(amount) {
  var st = S.cfg.settings || {}, id = String(st.promptpay || '').replace(/\D/g, '');
  var warn = function (t) { return '<div class="bk-hint bk-hint--warn">' + ico('i-alert') + '<span>' + t + '</span></div>'; };
  if (!id) return warn('ยังไม่ได้ตั้งเบอร์พร้อมเพย์ ใส่ได้ที่แท็บตั้งค่า แล้วรีเฟรชหน้านี้');
  if (id.length !== 10 && id.length !== 13 && id.length !== 15) return warn('เบอร์พร้อมเพย์ในหน้าตั้งค่าไม่ถูกต้อง (ต้องเป็นเบอร์ 10 หลัก หรือเลข 13 หลัก)');
  if (!(amount > 0)) return warn('ยอดต้องมากกว่า 0');
  if (typeof qrcode !== 'function') return warn('โหลดตัวสร้าง QR ไม่สำเร็จ ลองรีเฟรชหน้านี้');
  var qr = qrcode(0, 'M'); qr.addData(ppPayload(id, amount)); qr.make();
  return '<div class="bk-qr">' + qr.createImgTag(6, 12).replace('<img ', '<img class="bk-qr__img" alt="QR พร้อมเพย์" ') +
    '<span class="bk-qr__sum">' + fmt(amount) + ' บาท</span><span class="bk-qr__who">พร้อมเพย์ ' + maskId(id) + (st.promptpayName ? ' · ' + esc(st.promptpayName) : '') + '</span></div>' +
    warn('ให้ลูกค้าสแกน แล้วดูว่าเงินเข้าแล้วก่อนกดปิดบิล');
}

/* ---------- ขายหน้าร้านตอนคิดเงิน: เครื่องดื่ม ขนมถ้วย แคปหมู — เลือกประเภท พิมพ์ราคาเอง ไม่ส่งใบสั่ง ---------- */

      '<div class="bk-row" style="position:sticky;bottom:0;background:var(--surface)"><div class="bk-stepper"><button class="bk-stepper__btn" id="csqm" aria-label="ลดจำนวน">' + ico('i-minus', 'bk-ico--lg') + '</button><span class="bk-stepper__val" id="csq1">1</span><button class="bk-stepper__btn" id="csqp" aria-label="เพิ่มจำนวน">' + ico('i-plus', 'bk-ico--lg') + '</button></div>' +

  function close() { var w = $('#csw'); if (w) w.remove(); }

function payDone(b, r, method, given, billId) {

function saveSecs(list, then) {
  if (ED.saving) return;

  if (!list.length) { if (then) then(); return; }
  setBusy(true);

    if (i >= list.length) {
      setBusy(false); toast('บันทึกแล้ว · เครื่องอื่นต้องรีเฟรชหน้าเว็บถึงจะเห็น');
      if (S.view === 'settings') renderSettings();

    var sec = list[i++], rows, newPin = '';
    if (sec === 'settings') {
      rows = [['promptpay', ED.form.pp], ['promptpayName', ED.form.pn], ['longMinutes', ED.form.lm], ['autoReceipt', ED.form.ar === 'เปิด' ? 'Y' : '']];

      if (!cfg.cats.some(function (x) { return x.name === S.cat; })) S.cat = cfg.cats[0] && cfg.cats[0].name;
      ED.rows[sec] = secDef(sec) ? secDef(sec).rows(cfg) : ED.rows[sec];
