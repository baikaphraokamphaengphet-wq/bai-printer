/* ---------- report ---------- */
var RP = { from: '', to: '', g: 'day', seq: 0, last: null, more: {}, wide: false };
var TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function isWide() { return !!(window.matchMedia && window.matchMedia('(min-width:900px)').matches); }
// '2026-11-02' -> '2 พ.ย.' (ใส่ปี พ.ศ. เมื่อช่วงที่เลือกคาบเกี่ยวหลายปี)
function thDay(s, withYear) {
  var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(s)); if (!m) return String(s);
  return Number(m[3]) + ' ' + TH_MON[Number(m[2]) - 1] + (withYear ? ' ' + (Number(m[1]) + 543) : '');
}
function thKey(k, g, withYear) {
  k = String(k);
  if (g === 'year') return String(Number(k) + 543);
  if (g === 'month') { var m = /^(\d{4})-(\d\d)/.exec(k); return m ? TH_MON[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543) : k; }
  return thDay(k, withYear);
}
function presetOf() {
  var d = new Date(), y = d.getFullYear(), m = d.getMonth(), t = ymd(d);
  if (RP.from === t && RP.to === t && RP.g === 'day') return 'd';
  if (RP.from === ymd(new Date(y, m, 1)) && RP.to === ymd(new Date(y, m + 1, 0)) && RP.g === 'day') return 'm';
  if (RP.from === y + '-01-01' && RP.to === y + '-12-31' && RP.g === 'month') return 'y';
  return 'c';
}
function periodLabel() {
  var p = presetOf();
  if (p === 'd') return 'วันนี้'; if (p === 'm') return 'เดือนนี้'; if (p === 'y') return 'ปีนี้';
  var yr = String(RP.from).slice(0, 4) !== String(RP.to).slice(0, 4);
  return RP.from === RP.to ? thDay(RP.from, yr) : thDay(RP.from, yr) + ' – ' + thDay(RP.to, yr);
}
function renderReport() {
  var t = ymd(new Date());
  if (!RP.from) { RP.from = RP.to = t; }
  var p = presetOf();
  $('#main').innerHTML = '<div class="bk-rwrap"><div class="bk-rctl"><div class="bk-quick">' +
    [['d', 'วันนี้'], ['m', 'เดือนนี้'], ['y', 'ปีนี้'], ['c', 'กำหนดเอง']].map(function (x) { return '<button class="bk-cat' + (p === x[0] ? ' is-active' : '') + '" data-r="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div class="bk-dates"><input class="bk-field" type="date" id="rf" value="' + RP.from + '" aria-label="ตั้งแต่"><input class="bk-field" type="date" id="rt" value="' + RP.to + '" aria-label="ถึง"></div>' +
    '<div class="bk-row rsel"><select class="bk-field bk-grow" id="rg" aria-label="รูปแบบรายงาน"><option value="day">สรุปรายวัน</option><option value="month">สรุปรายเดือน</option><option value="year">สรุปรายปี</option></select><button class="bk-btn bk-btn--main" id="rgo">ดูรายงาน</button></div></div>' +
    '<div id="rout"></div></div>';
  $('#rg').value = RP.g;
  $$('#main [data-r]').forEach(function (b) {
    b.onclick = function () {
      var d = new Date(), y = d.getFullYear(), m = d.getMonth(), k = b.dataset.r;
      if (k === 'c') { $$('#main [data-r]').forEach(function (x) { x.classList.toggle('is-active', x === b); }); $('#rf').focus(); return; }
      if (k === 'd') { RP.from = RP.to = ymd(d); RP.g = 'day'; }
      if (k === 'm') { RP.from = ymd(new Date(y, m, 1)); RP.to = ymd(new Date(y, m + 1, 0)); RP.g = 'day'; }
      if (k === 'y') { RP.from = y + '-01-01'; RP.to = y + '-12-31'; RP.g = 'month'; }
      renderReport();
    };
  });
  ['#rf', '#rt'].forEach(function (id) { $(id).addEventListener('change', function () { $$('#main [data-r]').forEach(function (x) { x.classList.toggle('is-active', x.dataset.r === 'c'); }); }); });
  $('#rgo').onclick = function () {
    if (!$('#rf').value || !$('#rt').value) { toast('เลือกวันที่ให้ครบก่อน', true); return; }
    RP.from = $('#rf').value; RP.to = $('#rt').value; RP.g = $('#rg').value; renderReport();
  };
  runReport();
}
function runReport() {
  if (!$('#rout')) return;
  var seq = ++RP.seq;
  // ผลที่ตอบกลับช้า หลังผู้ใช้เปลี่ยนหน้าหรือกดดูรายงานใหม่แล้ว ให้ทิ้งไป
  function stale() { return seq !== RP.seq || S.view !== 'report' || !$('#rout'); }
  $('#rout').innerHTML = '<div class="bk-loading">กำลังคำนวณ…</div>';
  api('getReport', { from: RP.from, to: RP.to, groupBy: RP.g }).then(function (r) { if (!stale()) drawReport(r); }).catch(function (e) {
    if (stale()) return;
    fail(e);
    $('#rout').innerHTML = '<div class="bk-loading">โหลดรายงานไม่สำเร็จ<br><br><button class="bk-btn bk-btn--main" id="rretry">ลองใหม่</button></div>';
    $('#rretry').onclick = runReport;
  });
}
function drawReport(r) {
  if (!r) throw new Error('ไม่ได้รับข้อมูลรายงาน');
  RP.last = r; RP.more = {};
  layoutReport();
}
// ตารางอันดับ: โชว์ 5 อันดับแรก กด "ดูทั้งหมด" เพื่อเปิดเต็ม
function rankCard(key, title, head, rows, rowHtml) {
  var all = !!RP.more[key], list = all ? rows : rows.slice(0, 5);
  if (!rows.length) return '<div class="bk-card"><div class="bk-card__title">' + title + '</div><div class="bk-card__note">ไม่มีข้อมูลในช่วงนี้</div></div>';
  return '<div class="bk-card"><div class="bk-card__title">' + title + (rows.length > 5 && !all ? ' (5 อันดับแรก)' : '') + '</div><table class="bk-lite"><tr>' + head + '</tr>' + list.map(rowHtml).join('') + '</table>' +
    (rows.length > 5 ? '<button class="bk-smallbtn bk-btn--block bk-mt12" data-more="' + key + '">' + (all ? 'ย่อเหลือ 5 อันดับ' : 'ดูทั้งหมด (' + rows.length + ' รายการ)') + '</button>' : '') + '</div>';
}
function reportCards(r) {
  var C = {}, net = Number(r.totals.net) || 0, nb = r.totals.bills, tot = 0, withYear = String(RP.from).slice(0, 4) !== String(RP.to).slice(0, 4);
  C.kpi = '<div class="bk-kpis"><div class="bk-kpi bk-kpi--main"><div class="bk-kpi__label">ยอดขายรวม ' + esc(periodLabel()) + '</div><div class="bk-kpi__value">' + fmt(net) + ' ฿</div></div>' +
    '<div class="bk-kpi"><div class="bk-kpi__label">จำนวนบิล</div><div class="bk-kpi__value">' + nb + '</div></div>' +
    '<div class="bk-kpi"><div class="bk-kpi__label">เฉลี่ยต่อบิล</div><div class="bk-kpi__value">' + (nb ? fmt(Math.round(net / nb)) : '0') + ' ฿</div></div></div>';
  if (r.totals.discount) C.disc = '<div class="bk-hint bk-hint--warn">' + ico('i-alert') + '<span>ช่วงนี้มีบิลเก่าที่ใช้ส่วนลดรวม ' + fmt(r.totals.discount) + ' ฿ ยอดด้านบนเป็นยอดสุทธิหลังหักส่วนลดแล้ว (ก่อนลด ' + fmt(r.totals.gross) + ' ฿)</span></div>';
  if (!nb) { C.empty = '<div class="bk-card"><div class="bk-loading">ยังไม่มีบิลที่ปิดในช่วงนี้</div></div>'; }
  r.shops.forEach(function (s) { tot += Number(r.byShopNet[s]) || 0; });
  var check = r.check.ok
    ? '<div class="bk-check">' + ico('i-check') + 'ยอดแยกร้านรวม = ยอดแยกจุดรับเงิน (' + fmt(r.check.zone) + ' ฿)</div>'
    : '<div class="bk-check is-bad">' + ico('i-alert') + '<span>ยอดแยกร้าน (' + fmt(r.check.shopNet) + ' ฿) ไม่เท่ากับยอดแยกจุดรับเงิน (' + fmt(r.check.zone) + ' ฿) ต่างกัน ' + fmt(Math.abs(r.check.shopNet - r.check.zone)) + ' ฿</span></div>';
  if (nb) C.shops = '<div class="bk-card"><div class="bk-card__title">ยอดขายแยกร้าน</div>' + r.shops.map(function (s, i) {
    var k = shopKind(s), pc = tot ? Math.round((Number(r.byShopNet[s]) || 0) / tot * 100) : 0;
    return '<div' + (i ? ' class="bk-mt12"' : '') + '><div class="bk-row bk-between"><span class="bk-tag bk-tag--' + k + '">' + ico(shopIco(k), 'bk-ico--sm') + ' ' + esc(s) + '</span><b class="bk-b20">' + fmt(r.byShopNet[s]) + ' ฿</b></div>' +
      '<div class="bk-bar' + (k === 'noodle' ? ' bk-bar--noodle' : '') + '"><i style="width:' + pc + '%"></i></div></div>';
  }).join('') + check + '</div>';
  if (nb) {
    var last = null, sb = 0, sa = 0, cashNotes = [];
    var zrows = r.byZoneMethod.map(function (z) {
      var first = z.zone !== last; last = z.zone; sb += z.bills; sa += z.amount;
      if (z.method === 'เงินสด') cashNotes.push('เงินสด ' + esc(z.zone) + ' ' + fmt(z.amount) + ' ฿ ใช้ตรวจกับเงินในลิ้นชักของจุดนี้');
      return '<tr><td>' + (first ? esc(z.zone) : '') + '</td><td>' + esc(z.method) + '</td><td class="num">' + z.bills + '</td><td class="num">' + fmt(z.amount) + '</td></tr>';
    }).join('');
    C.cash = '<div class="bk-card"><div class="bk-card__title">แยกจุดรับเงิน</div><table class="bk-lite"><tr><th>โซน</th><th>วิธี</th><th class="num">บิล</th><th class="num">เงิน</th></tr>' + zrows +
      '<tr class="is-total"><td colspan="2">รวม</td><td class="num">' + sb + '</td><td class="num">' + fmt(sa) + '</td></tr></table>' +
      (cashNotes.length ? '<div class="bk-card__note">' + cashNotes.join('<br>') + '</div>' : '') + '</div>';
    C.cat = rankCard('cat', 'แยกประเภท', '<th>ประเภท</th><th class="num">จาน/ชิ้น</th><th class="num">ยอด</th>', r.byCategory,
      function (c) { return '<tr><td>' + esc(c.category) + '</td><td class="num">' + c.qty + '</td><td class="num">' + fmt(c.amount) + '</td></tr>'; });
    C.menu = rankCard('menu', 'ยอดขายรายเมนู', '<th>เมนู</th><th class="num">จาน</th><th class="num">ยอด</th>', r.byName,
      function (n) { return '<tr><td>' + esc(n.name) + '</td><td class="num">' + n.qty + '</td><td class="num">' + fmt(n.amount) + '</td></tr>'; });
    var lbl = RP.g === 'year' ? 'ปี' : RP.g === 'month' ? 'เดือน' : 'วันที่', many = r.shops.length > 1;
    C.daily = '<div class="bk-card"><div class="bk-card__title">สรุปราย' + (RP.g === 'year' ? 'ปี' : RP.g === 'month' ? 'เดือน' : 'วัน') + '</div><table class="bk-lite"><tr><th>' + lbl + '</th><th class="num">บิล</th>' +
      (many ? r.shops.map(function (s) { return '<th class="num bk-hide-m">' + esc(s) + '</th>'; }).join('') : '') + '<th class="num">ยอดรวม</th></tr>' +
      r.byPeriod.slice().reverse().map(function (p) {
        return '<tr><td>' + thKey(p.key, RP.g, withYear) + '</td><td class="num">' + p.bills + '</td>' +
          (many ? r.shops.map(function (s) { return '<td class="num bk-hide-m">' + fmt(p.shopsNet[s] || 0) + '</td>'; }).join('') : '') + '<td class="num">' + fmt(p.net) + '</td></tr>';
      }).join('') + '</table></div>';
  }
  var v = r.voided || { count: 0, amount: 0 };
  if (!v.count) C.voided = '<div class="bk-card"><div class="bk-card__title">รายการที่ถูกลบ</div><div class="bk-card__note">ไม่มีรายการที่ถูกลบในบิลที่ปิดแล้วของช่วงนี้</div></div>';
  else if (v.items && v.items.length) C.voided = '<div class="bk-card"><div class="bk-card__title">รายการที่ถูกลบ</div><table class="bk-lite"><tr><th>รายการ</th><th>โดย</th><th class="num">เงิน</th></tr>' +
    v.items.map(function (i) {
      return '<tr><td>' + esc(i.name) + ' ×' + i.qty + '<span class="bk-sub">โต๊ะ ' + esc(i.table) + (i.sent ? ' · ส่งแล้ว' : '') + (i.reason ? ' · ' + esc(i.reason) : '') + '</span></td><td>' + esc(i.by) + '</td><td class="num">' + fmt(i.amount) + '</td></tr>';
    }).join('') + '<tr class="is-total"><td colspan="2">รวม ' + v.count + ' รายการ</td><td class="num">' + fmt(v.amount) + '</td></tr></table>' +
    (v.count > v.items.length ? '<div class="bk-card__note">แสดง ' + v.items.length + ' รายการแรก ดูทั้งหมดได้ในชีต Items คอลัมน์ voided</div>' : '') + '</div>';
  else C.voided = '<div class="bk-card"><div class="bk-card__title">รายการที่ถูกลบ</div><div class="bk-card__note">ลบไป ' + v.count + ' รายการ รวม ' + fmt(v.amount) + ' ฿ ดูเหตุผลได้ในชีต Items คอลัมน์ voidReason</div></div>';
  return C;
}
function layoutReport() {
  var r = RP.last, out = $('#rout');
  if (!r || !out) return;
  var C = reportCards(r), wide = isWide(), pick = function (a) { return a.map(function (k) { return C[k] || ''; }).join(''); }, h;
  RP.wide = wide;
  if (wide) h = '<div class="bk-dash"><div class="bk-dash__col">' + pick(['kpi', 'disc', 'empty', 'shops']) + '</div><div class="bk-dash__col">' + pick(['cash', 'cat', 'daily']) + '</div><div class="bk-dash__col">' + pick(['menu', 'voided']) + '</div></div>';
  else h = '<div class="bk-rcol">' + pick(['kpi', 'disc', 'empty', 'shops', 'cash', 'cat', 'menu', 'daily', 'voided']) + '</div>';
  out.innerHTML = h;
  $$('#rout [data-more]').forEach(function (b) { b.onclick = function () { RP.more[b.dataset.more] = !RP.more[b.dataset.more]; layoutReport(); }; });
}
function reflowReport() { if (S.view === 'report' && RP.last && isWide() !== RP.wide) layoutReport(); }
window.addEventListener('resize', reflowReport);
try { var mq = window.matchMedia('(min-width:900px)'); if (mq.addEventListener) mq.addEventListener('change', reflowReport); } catch (e) {}
</script>
